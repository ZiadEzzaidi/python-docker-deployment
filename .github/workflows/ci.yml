name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  IMAGE: ghcr.io/ziadezzaidi/python-docker-deployment

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t deployment-lab:ci .

      - name: Start the container with runtime config
        run: >
          docker run -d --name app -p 127.0.0.1:8080:8000
          -e APP_MESSAGE="CI check" -e BIND_HOST=0.0.0.0
          deployment-lab:ci

      - name: Smoke test the running app
        run: python3 tests/smoke_test.py http://127.0.0.1:8080 "CI check"

      - name: Without APP_MESSAGE the app must refuse to start (exit code 1)
        run: |
          set +e
          docker run --rm -e BIND_HOST=0.0.0.0 deployment-lab:ci
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 without APP_MESSAGE, got $code"
            exit 1
          fi
          echo "ok: app refused to start without APP_MESSAGE (exit code 1)"

      - name: Show container logs if anything failed
        if: failure()
        run: docker logs app

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: The git tag must match VERSION in app.py
        run: |
          VERSION=$(python3 -c "from app import VERSION; print(VERSION)")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app.py VERSION $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the release image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$IMAGE:$VERSION" .
          docker push "$IMAGE:$VERSION"
